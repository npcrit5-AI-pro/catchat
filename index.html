<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e8">
<title>CatChat</title>
<script>
try{var t=localStorage.getItem("meow-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}
</script>
<style>
:root{--bg:#f4f0e8;--bg2:#efe8dc;--panel:#fffdf8;--ink:#1c1915;--mute:#6f675c;--line:#e4dccf;--coin:#b86e00;--accent:#0f766e;--accent-ink:#042f2c;--danger:#be123c;--me:#e7f4f1;--shadow:0 10px 30px rgba(70,50,20,.08);
color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--bg2:#181b27;--panel:#1c2030;--ink:#f6f3ec;--mute:#b0a89c;--line:#313748;--coin:#f5c16c;--accent:#5eead4;--accent-ink:#042f2c;--danger:#fb7185;--me:#24343a;--shadow:0 12px 32px rgba(0,0,0,.28);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--bg2:#181b27;--panel:#1c2030;--ink:#f6f3ec;--mute:#b0a89c;--line:#313748;--coin:#f5c16c;--accent:#5eead4;--accent-ink:#042f2c;--danger:#fb7185;--me:#24343a;--shadow:0 12px 32px rgba(0,0,0,.28);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 500px at 10% -10%,var(--bg2),transparent),var(--bg);color:var(--ink);font:400 16px/1.45 ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:.55em .9em;background:var(--accent);color:var(--accent-ink);font-weight:700}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
button.bad{background:var(--danger);color:#fff}
button.tiny{padding:.25em .5em;border-radius:8px;font-size:.8rem;font-weight:650}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.6em .75em;width:100%}
textarea{resize:none;min-height:44px;max-height:120px}
#login{min-height:100%;display:grid;place-items:center;padding:1.2rem}
#login form{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:1.5rem;width:min(420px,100%);display:grid;gap:.75rem;box-shadow:var(--shadow)}
#login h1{margin:0;font-size:2rem;letter-spacing:-.03em}
#login p{margin:0;color:var(--mute)}
#err{color:var(--danger);min-height:1.3em;font-size:.92rem}
#app{height:100dvh;display:none;flex-direction:column}
header{display:flex;align-items:center;gap:.5rem;padding:.65rem .9rem;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);position:sticky;top:0;z-index:3}
header b{font-size:1.15rem;letter-spacing:-.02em}
header .sp{flex:1}
.coins{color:var(--coin);font-weight:750;white-space:nowrap}
#status{min-height:0;color:var(--danger);font-size:.85rem;padding:0 .9rem}
#status:empty{display:none}
#status:not(:empty){padding:.35rem .9rem}
nav{display:flex;gap:.35rem;padding:.45rem .7rem;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:transparent;color:var(--mute);border:1px solid transparent;white-space:nowrap;min-height:40px}
nav button.on{background:var(--panel);color:var(--ink);border-color:var(--line)}
main{flex:1;min-height:0;display:flex;justify-content:center}
.pane{display:none;min-height:0;flex:1;max-width:760px;width:100%}
#log{flex:1;overflow-y:auto;padding:.8rem .9rem 1rem;display:flex;flex-direction:column;gap:.55rem}
.m{max-width:min(85%,520px);padding:.5rem .75rem;border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.m.me{background:var(--me)}
.m.hit{box-shadow:inset 3px 0 0 var(--danger)}
.m .n{font-weight:750;font-size:.84rem;color:var(--accent);display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.m .body{white-space:pre-wrap}
.m .meta{color:var(--mute);font-size:.75rem;font-weight:500}
.m.deleted{color:var(--mute);font-style:italic}
.quote{border-left:3px solid var(--accent);padding:.15rem .5rem;margin-bottom:.35rem;color:var(--mute);font-size:.85rem}
.sys{align-self:center;color:var(--mute);font-size:.86rem;text-align:center;max-width:90%}
.mention{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);border-radius:6px;padding:0 .2em;font-weight:750}
.mention.me{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger)}
#composer{border-top:1px solid var(--line);background:var(--panel);padding:.55rem .7rem calc(.6rem + env(safe-area-inset-bottom,0px));display:grid;gap:.4rem}
#replybar,#pending{display:flex;gap:.5rem;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.35rem .5rem;font-size:.88rem}
#replybar[hidden],#pending[hidden]{display:none}
#pending img{width:42px;height:42px;object-fit:cover;border-radius:8px}
#send{display:flex;gap:.4rem;align-items:flex-end}
#send textarea{flex:1;min-width:0}
#typing{min-height:1.1em;color:var(--mute);font-size:.82rem;padding:0 .95rem}
#pins,#polls{padding:.4rem .7rem 0;display:grid;gap:.4rem}
.pin{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:.4rem .6rem;font-size:.86rem;color:var(--ink);text-align:left;font-weight:600;width:100%}
.poll{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:.7rem;display:grid;gap:.4rem}
.poll-opt{position:relative;overflow:hidden;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:600}
.poll-opt .bar{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 30%,transparent)}
.poll-opt span{position:relative}
.poll-opt.on{border-color:var(--accent)}
.pic{padding:0;background:transparent;border-radius:12px;display:block;margin-top:.35rem}
.pic img{max-width:min(260px,100%);max-height:220px;border-radius:12px;display:block}
.rbar,.tools{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.3rem}
.chip{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.1em .45em;font-weight:650}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.menu{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.35rem}
#ac{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:grid;overflow:hidden;z-index:4}
#ac[hidden]{display:none}
#ac button{background:transparent;color:var(--ink);border-radius:0;text-align:left;font-weight:600}
#ac button.on,#ac button:hover{background:var(--bg)}
#p-chat{position:relative;display:none;flex-direction:column}
.scroll{overflow-y:auto;padding:.9rem;gap:.7rem;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:.8rem;display:flex;gap:.75rem;align-items:center;box-shadow:var(--shadow)}
.card .e{font-size:1.8rem}.card .i{flex:1;min-width:0}.card small{color:var(--mute);display:block}
.price{color:var(--coin);font-weight:750}
h2{margin:.3rem 0;font-size:1.02rem}
.row{display:flex;gap:.45rem;flex-wrap:wrap}.row>*{flex:1;min-width:90px}
.empty{color:var(--mute);padding:1rem;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.55em 1em;border-radius:12px;display:none;z-index:9;max-width:min(92vw,420px);text-align:center}
.tag{font-size:.72rem;background:var(--coin);color:#2b1d00;border-radius:6px;padding:0 .4em}
.tag.bad{background:var(--danger);color:#fff}
body[data-tab=chat] #p-chat{display:flex}
body[data-tab=shop] #p-shop,body[data-tab=wallet] #p-wallet,body[data-tab=settings] #p-settings,body[data-tab=admin] #p-admin{display:grid}
.mw{display:flex;gap:.45rem;align-items:flex-end;max-width:100%}
.mw.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:50%;flex:none;background:var(--line);object-fit:cover}
.av.big{width:104px;height:104px}
.noav .mw .av{display:none}
.big-bal{font-size:2.4rem;font-weight:750;color:var(--coin);line-height:1.1}
.set{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:.9rem;display:grid;gap:.55rem}
.sw,.seg{display:flex;gap:.4rem;flex-wrap:wrap}
.sw button{width:32px;height:32px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw button.on,.seg button.on{outline:2px solid var(--accent);outline-offset:2px}
.seg button{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.set label.t{display:flex;gap:.6rem;align-items:center}
.set input[type=checkbox]{width:auto}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:8;padding:1rem}
#modal[hidden]{display:none}
.sheet{background:var(--panel);color:var(--ink);border-radius:18px 18px 12px 12px;padding:1rem;width:min(480px,100%);display:grid;gap:.55rem;box-shadow:var(--shadow);max-height:min(86dvh,640px);overflow:auto}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;z-index:10;padding:1rem}
#lightbox[hidden]{display:none}
#lightbox img{max-width:min(960px,100%);max-height:86dvh;border-radius:12px}
#drop{position:fixed;inset:.6rem;border:2px dashed var(--accent);border-radius:18px;display:none;place-items:center;background:color-mix(in srgb,var(--panel) 88%,transparent);z-index:7;font-weight:750;pointer-events:none}
body.drag #drop{display:grid}
#mentions[hidden]{display:none}
.badge{background:var(--danger);color:#fff;border-radius:999px;padding:0 .4em;font-size:.75rem}
@media(max-width:640px){header b{font-size:1rem}.coins{font-size:.92rem}button{min-height:40px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body data-tab="chat">
<div id="login"><form id="lf">
 <h1>CatChat</h1>
 <p>A small room for chat, coins, and the shop. Your name stays yours.</p>
 <input id="nm" placeholder="Username" maxlength="16" autocomplete="username" aria-label="Username">
 <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" aria-label="Password">
 <p>New here? Choose a password and the account is created.</p>
 <div id="err" role="alert"></div>
 <button>Log in or sign up</button>
</form></div>

<div id="app">
 <header>
  <b>CatChat</b>
  <button class="ghost tiny" id="theme" type="button">Theme</button>
  <button class="ghost tiny" id="mentions" type="button" hidden>Mentions <span class="badge" id="mcount">0</span></button>
  <span class="sp"></span>
  <span class="coins" id="bal"></span>
  <button class="ghost" id="out" type="button">Leave</button>
 </header>
 <div id="status" role="status"></div>
 <nav id="nav"></nav>
 <main>
  <section class="pane" id="p-chat">
   <div id="pins"></div>
   <div id="polls"></div>
   <div id="log"></div>
   <div id="typing" aria-live="polite"></div>
   <div id="composer">
    <div id="ac" hidden role="listbox"></div>
    <div id="replybar" hidden></div>
    <div id="pending" hidden></div>
    <form id="send">
     <button class="ghost" id="attach" type="button" aria-label="Attach image">＋</button>
     <input id="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
     <button class="ghost" id="pollbtn" type="button" aria-label="Create a poll">Poll</button>
     <textarea id="msg" rows="1" maxlength="300" placeholder="Message…  @ to mention, /pay name 25" aria-label="Message" autocomplete="off"></textarea>
     <button id="sendbtn" type="submit">Send</button>
    </form>
   </div>
  </section>
  <section class="pane scroll" id="p-shop"></section>
  <section class="pane scroll" id="p-wallet"></section>
  <section class="pane scroll" id="p-settings"></section>
  <section class="pane scroll" id="p-admin"></section>
 </main>
</div>
<div id="toast" role="status"></div>
<div id="lightbox" hidden><img alt="Full size picture"></div>
<div id="modal" hidden></div>
<div id="drop">Drop an image to attach it</div>

<script>
const ROOT="meowmaster100", $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const REACTS=["👍","❤️","😂","🐱","🎉","😮","😢"];
let meId=null,players={},items={},msgs=[],polls=[],pins=[],tab="chat";
let replyTo=null, pending=null, editing=null, openMenu=0, acIndex=0, acNames=[];
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const me=()=>players[meId], isAdmin=()=>!!(me()&&me().admin);
const FUR=["#f2a65a","#8d8d9b","#2f2f3a","#f4efe6","#c98a5b","#e8c9a0","#7aa7c7","#d6a6e0"],EYE=["#4cc38a","#f5c542","#4aa3ff","#ff8a5c","#b07cff"],PAT=["plain","stripes","patch","muzzle"],ACC=["none","bow","crown","glasses","hat"];
const hashStr=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const defAv=n=>{const h=hashStr(String(n).toLowerCase());return{mode:"cat",fur:h%FUR.length,eyes:(h>>3)%EYE.length,pat:(h>>5)%PAT.length,acc:0}};
function catSVG(a,cls){
 const f=FUR[a.fur|0]||FUR[0],e=EYE[a.eyes|0]||EYE[0],p=PAT[a.pat|0]||"plain",c=ACC[a.acc|0]||"none";
 const eye=x=>`<ellipse cx="${x}" cy="56" rx="6" ry="7" fill="${e}"/><ellipse cx="${x}" cy="56" rx="2.2" ry="5" fill="#1a1a1a"/><circle cx="${x+2}" cy="53" r="1.6" fill="#fff"/>`;
 return `<svg class="${cls}" viewBox="0 -8 100 108" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="16,42 20,8 46,26" fill="${f}"/><polygon points="84,42 80,8 54,26" fill="${f}"/><polygon points="23,33 25,17 38,27" fill="#ff9db0"/><polygon points="77,33 75,17 62,27" fill="#ff9db0"/><ellipse cx="50" cy="58" rx="36" ry="31" fill="${f}"/>`
 +(p==="stripes"?`<path d="M50 28v10M40 30l2 8M60 30l-2 8" stroke="rgba(0,0,0,.28)" stroke-width="3" stroke-linecap="round"/>`:p==="patch"?`<ellipse cx="34" cy="52" rx="14" ry="13" fill="rgba(0,0,0,.22)"/>`:p==="muzzle"?`<ellipse cx="50" cy="71" rx="18" ry="13" fill="rgba(255,255,255,.7)"/>`:"")
 +eye(37)+eye(63)+`<polygon points="46,66 54,66 50,71" fill="#ff7d96"/><path d="M50 71q-5 6-10 2M50 71q5 6 10 2" stroke="#3a2a2a" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M30 68l-16-3M30 72l-16 3M70 68l16-3M70 72l16 3" stroke="rgba(0,0,0,.35)" stroke-width="1.2" stroke-linecap="round"/>`
 +(c==="bow"?`<polygon points="72,24 86,16 86,32" fill="#ff5d8f"/><polygon points="72,24 58,16 58,32" fill="#ff5d8f"/><circle cx="72" cy="24" r="4" fill="#d63b6e"/>`:c==="crown"?`<polygon points="32,26 35,6 43,18 50,3 57,18 65,6 68,26" fill="#ffc93c" stroke="#c98f00" stroke-width="1.5"/>`:c==="glasses"?`<circle cx="37" cy="56" r="10" fill="none" stroke="#222" stroke-width="2.2"/><circle cx="63" cy="56" r="10" fill="none" stroke="#222" stroke-width="2.2"/><path d="M47 56h6" stroke="#222" stroke-width="2.2"/>`:c==="hat"?`<polygon points="38,26 50,-6 62,26" fill="#7b61ff"/><circle cx="50" cy="-6" r="4" fill="#ffc93c"/>`:"")+`</svg>`;
}
function safePhoto(u){return /^\/avatar\/[A-Za-z0-9_]{2,16}\?v=\d+$/.test(u)?u:""}
function safeImg(u){return /^\/img\/[a-f0-9]{24}$/.test(u)?u:""}
function avHTML(p,big){
 const a=(p&&p.avatar)||defAv((p&&p.name)||"?"),cls="av"+(big?" big":"");
 const src=a.mode==="photo"?safePhoto(a.photo):"";
 return src?`<img class="${cls}" alt="" src="${esc(src)}">`:catSVG(a,cls);
}
const showAv=()=>ls.get("meow-showav")!=="0";
const applyAv=()=>document.body.classList.toggle("noav",!showAv());
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3200)}
function fail(t){$("#err").textContent=t||""}
function clock(ts){try{return new Date(ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}catch(e){return ""}}
function fmtText(text){
 const src=String(text??""); let out="", last=0, re=/(^|[^A-Za-z0-9_])@([A-Za-z0-9_]{2,16})/g, m;
 while((m=re.exec(src))){
  out+=esc(src.slice(last,m.index+m[1].length));
  const id=m[2].toLowerCase(), pl=players[id];
  if(pl) out+=`<span class="mention${id===meId?" me":""}">@${esc(pl.name)}</span>`;
  else out+=esc("@"+m[2]);
  last=m.index+m[0].length;
 }
 return out+esc(src.slice(last));
}
function themeNow(){const set=document.documentElement.dataset.theme; if(set==="light"||set==="dark") return set; return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function applyTheme(mode){
 if(mode==="light"||mode==="dark"){document.documentElement.dataset.theme=mode; ls.set("meow-theme",mode)}
 else {delete document.documentElement.dataset.theme; ls.set("meow-theme","system")}
 const dark=themeNow()==="dark";
 $("#theme").textContent=dark?"Dark":"Light";
 const meta=document.querySelector('meta[name="theme-color"]');
 if(meta) meta.content=dark?"#12141c":"#f4f0e8";
}
function initTheme(){const saved=ls.get("meow-theme"); applyTheme(saved==="light"||saved==="dark"?saved:"system")}
initTheme();
$("#theme").onclick=()=>applyTheme(themeNow()==="dark"?"light":"dark");
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if((ls.get("meow-theme")||"system")==="system") applyTheme("system")});

let token=ls.get("meow-token")||"",es=null;
function showLogin(msg){$("#app").style.display="none";$("#login").style.display="grid";fail(msg||"")}
function logoutLocal(){ls.del("meow-token");token="";if(es){es.close();es=null}}
async function api(a,body){
 let r;
 try{r=await fetch("/api/"+a,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify(body||{})})}
 catch(e){toast("Can’t reach CatChat. Check your connection and try again."); throw e}
 const j=await r.json().catch(()=>({}));
 if(r.status===401){logoutLocal();showLogin("Please log in again.");throw new Error("auth")}
 if(!r.ok){toast(j.error||"That didn’t work. Try again.");throw new Error(j.error||"failed")}
 return j;
}
function enter(t,id){token=t;ls.set("meow-token",t);meId=id;fail("");$("#login").style.display="none";$("#app").style.display="flex";start()}
(async()=>{
 if(!token)return;
 try{const r=await fetch("/api/me",{headers:{Authorization:"Bearer "+token}});
  if(r.ok)enter(token,(await r.json()).id);else logoutLocal()}catch(e){$("#status").textContent="Can’t reach CatChat right now."}
})();
$("#lf").onsubmit=async e=>{
 e.preventDefault();const n=$("#nm").value.trim(),pw=$("#pw").value;
 if(!/^[A-Za-z0-9_]{2,16}$/.test(n))return fail("Use 2–16 letters, numbers or underscores.");
 if(pw.length<6)return fail("Password must be at least 6 characters.");
 try{
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,pw})});
  const j=await r.json().catch(()=>({})); if(!r.ok)return fail(j.error||"Couldn’t log in.");
  enter(j.token,j.id);
 }catch(x){fail("Can’t reach CatChat. Check your connection and try again.")}
};
$("#out").onclick=()=>{fetch("/api/logout",{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:"{}"}).finally(()=>{logoutLocal();location.reload()})};

function start(){
 applyAv();if(es)es.close(); $("#status").textContent="";
 es=new EventSource("/events?t="+encodeURIComponent(token));
 es.addEventListener("state",ev=>{
  const d=JSON.parse(ev.data);
  players={};(d.players||[]).forEach(p=>players[p.id]=p);
  if(players[meId])Object.assign(players[meId],d.me||{});
  items={};(d.items||[]).forEach(i=>items[i.id]=i);
  msgs=d.messages||[]; polls=d.polls||[]; pins=d.pins||[];
  $("#status").textContent=""; renderAll();
 });
 es.addEventListener("typing",ev=>{
  let list=[]; try{list=JSON.parse(ev.data)}catch(e){}
  list=list.filter(x=>x.id!==meId);
  $("#typing").textContent=list.length?list.map(x=>x.name).join(", ")+(list.length>1?" are typing…":" is typing…"):"";
  clearTimeout(es._type);
  if(list.length) es._type=setTimeout(()=>{$("#typing").textContent=""},4000);
 });

async function stageFile(file){

async function compressImage(file){
 const bmp=await createImageBitmap(file).catch(()=>{throw new Error("Couldn’t read that image. Use a JPEG, PNG, GIF, or WebP.")});
 let w=bmp.width,h=bmp.height,q=0.55,max=800;
 const fit=Math.min(1,max/Math.max(w,h,1)); w=Math.max(1,Math.round(w*fit)); h=Math.max(1,Math.round(h*fit));
 const canvas=document.createElement("canvas"), ctx=canvas.getContext("2d",{alpha:false});
 let data="";
 for(let i=0;i<7;i++){
  canvas.width=w; canvas.height=h; ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(bmp,0,0,w,h);
  data=canvas.toDataURL("image/jpeg",q);
  if(data.length<52000) break;
  q=Math.max(0.32,q-0.08); w=Math.max(1,Math.round(w*0.82)); h=Math.max(1,Math.round(h*0.82));
 }
 if(data.length>56000) throw new Error("That image is still too big after compressing. Try a smaller one.");
 return data;
}

 const a=m.avatar||defAv(m.name);
 const sw=(arr,k,cur)=>arr.map((c,i)=>`<button type="button" style="background:${c}" class="${cur===i?"on":""}" data-${k}="${i}" aria-label="${k} ${i+1}"></button>`).join("");
 const opt=(arr,k,cur)=>arr.map((n,i)=>`<button type="button" class="${cur===i?"on":""}" data-${k}="${i}">${n}</button>`).join("");
 const mode=ls.get("meow-theme")||"system";
 $("#p-settings").innerHTML=`<div class="set" style="justify-items:center;text-align:center">${avHTML({...m,avatar:a},true)}<b>${esc(m.name)}</b>${m.muted?'<span class="tag bad">muted</span>':""}</div>
 <h2>Color theme</h2><div class="set"><div class="seg"><button type="button" data-theme="system" class="${mode==="system"?"on":""}">System</button><button type="button" data-theme="light" class="${mode==="light"?"on":""}">Light</button><button type="button" data-theme="dark" class="${mode==="dark"?"on":""}">Dark</button></div><small style="color:var(--mute)">Saved on this device. System follows your phone or computer.</small></div>
 <h2>Profile picture</h2><div class="set"><div class="seg"><button type="button" class="${a.mode!=="photo"?"on":""}" data-mode="cat">Cartoon cat</button><button type="button" class="${a.mode==="photo"?"on":""}" data-mode="photo" ${a.photo?"":"disabled"}>My photo</button></div>
 <label>Upload a picture<input type="file" id="up" accept="image/*"></label>${a.photo?'<button type="button" class="ghost" data-rmphoto>Remove my photo</button>':""}</div>
 <h2>Customize your cat</h2><div class="set"><b>Fur</b><div class="sw">${sw(FUR,"fur",a.fur|0)}</div><b>Eyes</b><div class="sw">${sw(EYE,"eyes",a.eyes|0)}</div><b>Pattern</b><div class="seg">${opt(["Plain","Stripes","Patch","Muzzle"],"pat",a.pat|0)}</div><b>Accessory</b><div class="seg">${opt(["None","Bow","Crown","Glasses","Hat"],"acc",a.acc|0)}</div><button type="button" class="ghost" data-rand>Surprise me</button></div>
 <h2>Display</h2><div class="set"><label class="t"><input type="checkbox" id="showav" ${showAv()?"checked":""}>Show profile pictures in chat</label></div>`;
}
async function saveAv(patch){const m=me();if(!m)return; try{await api("avatar",{...(m.avatar||defAv(m.name)),...patch})}catch(x){}}
$("#p-settings").onclick=e=>{
 const b=e.target.closest("button"),d=b&&b.dataset;if(!d)return;const r=n=>Math.floor(Math.random()*n);
 if(d.theme){applyTheme(d.theme); if(me())renderSettings()}
 else if(d.mode)saveAv({mode:d.mode});
 else if(d.fur!==undefined)saveAv({mode:"cat",fur:+d.fur});
 else if(d.eyes!==undefined)saveAv({mode:"cat",eyes:+d.eyes});
 else if(d.pat!==undefined)saveAv({mode:"cat",pat:+d.pat});
 else if(d.acc!==undefined)saveAv({mode:"cat",acc:+d.acc});
 else if(d.rand!==undefined)saveAv({mode:"cat",fur:r(FUR.length),eyes:r(EYE.length),pat:r(PAT.length),acc:r(ACC.length)});
 else if(d.rmphoto!==undefined)saveAv({mode:"cat",photo:""});
};
$("#p-settings").onchange=e=>{
 if(e.target.id==="showav"){ls.set("meow-showav",e.target.checked?"1":"0");applyAv()}
 else if(e.target.id==="up"){
  const f=e.target.files[0];if(!f||!f.type.startsWith("image/"))return toast("Choose an image file");
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{
   const c=document.createElement("canvas");c.width=c.height=96;const s=Math.min(img.width,img.height);
   c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,96,96);
   saveAv({mode:"photo",photo:c.toDataURL("image/jpeg",.8)});
  };img.onerror=()=>toast("Couldn’t read that image");img.src=rd.result};rd.readAsDataURL(f);
 }
};

function renderAdmin(){
 const box=$("#p-admin");if(!isAdmin()){box.innerHTML="";return}
 if(box.contains(document.activeElement)&&(document.activeElement.tagName==="INPUT"||document.activeElement.tagName==="TEXTAREA"))return;
 const ps=Object.entries(players).sort((a,b)=>a[1].name.localeCompare(b[1].name));
 const reports=(me().reports||[]).filter(r=>r.status==="open");
 box.innerHTML=`<h2>Reports ${reports.length?`<span class="badge">${reports.length}</span>`:""}</h2>
 ${reports.length?reports.map(r=>`<div class="card" style="align-items:flex-start;flex-wrap:wrap"><div class="i"><b>${esc(r.kind)} · ${esc(r.target)}</b><small>From ${esc(r.reporter)} · ${esc(r.excerpt||"")}</small><div>${esc(r.reason)}</div></div>
  <button type="button" class="ghost tiny" data-dismiss="${r.id}">Dismiss</button>
  ${r.kind==="message"?`<button type="button" class="tiny bad" data-rdel="${r.id}">Delete message</button>`:""}
  <button type="button" class="ghost tiny" data-rmute="${r.id}" data-hours="1">Mute 1h</button>
  <button type="button" class="ghost tiny" data-rmute="${r.id}" data-hours="24">Mute 1d</button>
  <button type="button" class="ghost tiny" data-rmute="${r.id}" data-hours="0">Mute</button>
  ${meId===ROOT?`<button type="button" class="tiny bad" data-rban="${r.id}">Ban</button>`:""}
 </div>`).join(""):'<div class="empty">No open reports.</div>'}
 <h2>Add shop item</h2>
 <form id="af" class="card" style="display:grid;gap:.5rem"><div class="row"><input name="emoji" placeholder="Emoji" maxlength="4" aria-label="Emoji"><input name="name" placeholder="Item name" required maxlength="40" aria-label="Item name"></div>
 <input name="desc" placeholder="Description" maxlength="80" aria-label="Description"><div class="row"><input name="price" type="number" min="1" placeholder="Price" required aria-label="Price"><input name="stock" type="number" min="1" placeholder="Stock (blank = unlimited)" aria-label="Stock"></div><button>Add item</button></form>
 <h2>Items</h2>${Object.entries(items).map(([id,i])=>`<div class="card"><div class="e">${esc(i.emoji||"🎁")}</div><div class="i"><b>${esc(i.name)}</b><small>${i.price} coins</small></div><button class="bad" type="button" data-rm="${id}">Remove</button></div>`).join("")||'<div class="empty">No items.</div>'}
 <h2>Players</h2>${ps.map(([id,p])=>{const R=meId===ROOT,self=id===ROOT;return `<div class="card" style="flex-wrap:wrap"><div class="i"><b>${esc(p.name)}</b>${p.admin?'<span class="tag">admin</span>':""}${p.banned?'<span class="tag bad">banned</span>':""}${p.muted?'<span class="tag bad">muted</span>':""}<small>${self?"∞":p.coins} coins</small></div>${self?"":`<button class="ghost" type="button" data-adm="${id}">${p.admin?"Remove admin":"Make admin"}</button><button class="ghost" type="button" data-mute="${id}">${p.muted?"Unmute":"Mute 1d"}</button>`}${R&&!self?`<div class="row" style="flex-basis:100%"><input type="number" placeholder="Coins (− takes)" data-amt="${id}" aria-label="Coins for ${esc(p.name)}"><button type="button" data-give="${id}">Give</button><button type="button" class="${p.banned?"ghost":"bad"}" data-ban="${id}">${p.banned?"Unban":"Ban"}</button></div>`:""}</div>`}).join("")}
 <h2>Chat</h2><button class="bad" type="button" data-clear>Clear all messages</button>`;
}
$("#p-admin").onsubmit=async e=>{
 e.preventDefault();if(!isAdmin())return;const f=new FormData(e.target);
 try{await api("item/add",{name:f.get("name"),emoji:f.get("emoji"),desc:f.get("desc"),price:f.get("price"),stock:f.get("stock")});e.target.reset();toast("Item added")}catch(x){}
};
$("#p-admin").onclick=async e=>{
 if(!isAdmin())return;const d=e.target.dataset;
 try{
  if(d.dismiss)await api("report/dismiss",{id:+d.dismiss});
  else if(d.rdel)await api("report/act",{id:+d.rdel,action:"delete"});
  else if(d.rmute)await api("report/act",{id:+d.rmute,action:"mute",hours:+d.hours});
  else if(d.rban)await api("report/act",{id:+d.rban,action:"ban"});
  else if(d.rm)await api("item/remove",{id:d.rm});
  else if(d.adm)await api("admin/promote",{to:d.adm});
  else if(d.mute)await api("admin/mute",{to:d.mute,hours:24});
  else if(d.give&&meId===ROOT){const n=parseInt(document.querySelector(`[data-amt="${CSS.escape(d.give)}"]`).value);if(!n)return toast("Enter an amount");await api("admin/give",{to:d.give,n})}
  else if(d.ban&&meId===ROOT)await api(d.ban&&players[d.ban]&&players[d.ban].banned?"admin/unban":"admin/ban",{to:d.ban});
  else if("clear" in d){const b=e.target;if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Click again to delete everything";setTimeout(()=>{b.dataset.sure="";b.textContent="Clear all messages"},3000)}else await api("admin/clear")}
 }catch(x){}
};
</script>
</body>
</html>
